<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="LoginPage.css">
</head>

<body>
<form id="reg" autocomplete="off" th:action="@{/Dashboard}" th:object="${user}" method="post">
    <div id="regis">
        <div id="webName">
            <span>AI </span>
            <span id="invw">INTERVIEW</span>
        </div><br><br>

        <div>
            <span>Email:</span><br>
            <input type="email" th:field="*{email}" placeholder="Email" required>
        </div><br>
        <div>
            <span>Password:</span><br>
            <input type="password" th:field="*{password}" placeholder="Password" required maxlength="8">
        </div>
        <div th:if="${ErrorMsgs}">
            <h4 style="color: red" th:text="${ErrorMsgs}"></h4>
        </div>
        <br>
        <div id="fgt">
            <a href="#">Forget Password ?</a>
        </div> <br><br>
        <div>
            <span><input class="btn1" type="submit" value="Login"></span>
        </div><br>
        <div>
            <p>Don't Have Account ?</p>
            <span><a class="btn2" th:href="@{/RegistrationPage}">Register</a></span>
        </div>
    </div>
</form>
</body>

</html>
