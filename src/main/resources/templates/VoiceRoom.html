<!doctype html>
<html lang="en" xmlns:th="http://thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live AI Interview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="VoiceRoom.css">
</head>

<body>
<div class="container-fluid" id="header">
    <div>
        <span id="audio">Audio Session Only</span>
        <span id="span1"> Position:</span>
        <span id="spa" th:text="${role}"></span>
    </div>
    <div class="text-sm font-mono text-gray-500" id="timerDisplay">00:00:00</div>
</div>

<div class="container" id="room">
    <div id="interviewer">
        <p id="un" th:text="${userNme}"></p>
    </div>
    <div id="currQuest">
        <p id="para1">AI INTERVIEWER</p>
        <p id="para2">CURRENT QUESTION</p>
        <h2>Can you walk me through a time you had to handle a major conflict within a design team?</h2>
        <p id="answerText"></p>
        <p id="scoreText"></p>
    </div>
</div>

<div class="container" id="roombanner">
    <div id="tools1">
        <div id="btn">
            <button id="btn3"><img th:src="@{/img/microphone.png}" alt="">
            </button>
            <p>MIC</p>
        </div>
        <div id="tools">
            <button id="btn2">Skip Question
                <img th:src="@{/img/right-chevron.png}" alt="">
            </button>
        </div>
    </div>
    <div id="tool1">
        <div id="tools5">
            <button id="btn4">Next Question
                <img th:src="@{/img/right-chevron.png}" alt="">
            </button>
        </div>
        <div id="tools6">
            <button id="btn1">End Interview
                <img th:src="@{/img/log-out.png}" alt="">
            </button>
        </div>

    </div>
</div>
<script src="VoiceRoom.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
